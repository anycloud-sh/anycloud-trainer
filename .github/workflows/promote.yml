name: Promote validated digest

on:
  workflow_dispatch:
    inputs:
      digest:
        description: Validated sha256 image digest
        required: true
        type: string
      release_tag:
        description: Release tag to attach without rebuilding
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag existing manifest
        env:
          DIGEST: ${{ inputs.digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$DIGEST" in
            sha256:[0-9a-f][0-9a-f]*) ;;
            *) echo "digest must start with sha256:" >&2; exit 2 ;;
          esac
          docker buildx imagetools create \
            --tag "ghcr.io/anycloud-sh/anycloud-trainer:${RELEASE_TAG}" \
            "ghcr.io/anycloud-sh/anycloud-trainer@${DIGEST}"

