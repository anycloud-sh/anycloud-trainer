[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "anycloud-trainer"
version = "0.1.0"
description = "A stateful LoRA training service for AnyCloud GPU deployments."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
gpu = [
  "accelerate==1.10.1",
  "peft==0.20.0",
  "safetensors==0.6.2",
  "torch==2.8.0",
  "transformers==5.5.3",
]
dev = [
  "pytest==9.0.2",
  "ruff==0.14.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anycloud_trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "T20"]

[tool.ruff.lint.per-file-ignores]
"src/anycloud_trainer/runtime.py" = ["ANN401"]
